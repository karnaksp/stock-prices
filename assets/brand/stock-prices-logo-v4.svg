<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Stock Prices cyberpunk logo">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="72%">
      <stop offset="0" stop-color="#12202A"/>
      <stop offset=".52" stop-color="#090D13"/>
      <stop offset="1" stop-color="#030508"/>
    </radialGradient>
    <linearGradient id="neon" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#25E6B1"/>
      <stop offset=".5" stop-color="#48D9FF"/>
      <stop offset="1" stop-color="#A8FF3E"/>
    </linearGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFB12B"/>
      <stop offset="1" stop-color="#FF3D5A"/>
    </linearGradient>
    <pattern id="scanlines" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M0 1H8" stroke="#9CF8FF" stroke-opacity=".08"/>
    </pattern>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#45D6FF" stroke-opacity=".07"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="11" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="coreClip">
      <path d="M247 297L708 226L837 367L771 718L309 799L176 643Z"/>
    </clipPath>
  </defs>

  <rect width="1024" height="1024" rx="214" fill="url(#bg)"/>
  <rect x="40" y="40" width="944" height="944" rx="178" fill="url(#grid)"/>
  <rect x="40" y="40" width="944" height="944" rx="178" fill="url(#scanlines)"/>

  <g fill="none" stroke-linecap="square">
    <path d="M123 338V156H305" stroke="#42E8C0" stroke-width="18" filter="url(#softGlow)"/>
    <path d="M719 156H901V338" stroke="#48D9FF" stroke-width="18" filter="url(#softGlow)"/>
    <path d="M901 686V868H719" stroke="#A8FF3E" stroke-width="18" filter="url(#softGlow)"/>
    <path d="M305 868H123V686" stroke="#FF5A3D" stroke-width="18" filter="url(#softGlow)"/>
  </g>

  <path d="M278 326L727 258L864 391L796 742L340 830L204 670Z"
        fill="#FF425A" opacity=".34" transform="translate(-16 12)"/>
  <path d="M247 297L708 226L837 367L771 718L309 799L176 643Z"
        fill="#071016" stroke="url(#neon)" stroke-width="18" filter="url(#glow)"/>

  <g clip-path="url(#coreClip)">
    <path d="M92 662L260 559L380 610L515 408L639 492L903 285"
          fill="none" stroke="#FF425A" stroke-width="48" opacity=".35"
          transform="translate(-13 13)"/>
    <path d="M92 662L260 559L380 610L515 408L639 492L903 285"
          fill="none" stroke="url(#neon)" stroke-width="38"
          stroke-linejoin="bevel" filter="url(#softGlow)"/>
    <path d="M92 662L260 559L380 610L515 408L639 492L903 285"
          fill="none" stroke="#EFFFF9" stroke-width="8" opacity=".9"
          stroke-linejoin="bevel"/>

    <g fill="url(#hot)">
      <path d="M160 444H366V472H160Z"/>
      <path d="M601 605H858V631H601Z"/>
      <path d="M254 705H470V724H254Z"/>
    </g>
    <g fill="#48D9FF">
      <path d="M124 489H274V505H124Z"/>
      <path d="M704 325H882V342H704Z"/>
      <path d="M478 755H682V769H478Z"/>
    </g>
  </g>

  <g filter="url(#glow)">
    <circle cx="260" cy="559" r="18" fill="#25E6B1"/>
    <circle cx="515" cy="408" r="18" fill="#A8FF3E"/>
    <circle cx="639" cy="492" r="18" fill="#FFB12B"/>
  </g>

  <g fill="#9CF8FF">
    <path d="M110 418H174V430H110Z"/>
    <path d="M850 522H932V534H850Z"/>
    <path d="M91 581H147V593H91Z"/>
  </g>
  <g fill="#FF4B56">
    <path d="M842 551H946V563H842Z"/>
    <path d="M132 452H203V464H132Z"/>
  </g>
</svg>
