services:
  stock-prices-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stock-prices-bot
    env_file:
      - .env
    environment:
      MPLBACKEND: Agg
      PYTHONPATH: /app/src
      STOCK_PRICES_OUTPUT_DIR: /app/animations
      STOCK_PRICES_RETENTION_DAYS: ${STOCK_PRICES_RETENTION_DAYS:-0}
      STOCK_PRICES_UNIVERSE_FILE: ${STOCK_PRICES_UNIVERSE_FILE:-}
    command: ["python", "-m", "stock_prices", "bot"]
    init: true
    restart: unless-stopped
    volumes:
      - ./src:/app/src:ro
      - ./config:/app/config:ro
      - ./animations:/app/animations
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "python -m stock_prices._internal.healthcheck"]
      interval: 1m
      timeout: 30s
      retries: 5
      start_period: 20s
